<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dceaf7"/>
      <stop offset="100%" stop-color="#c4daf0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Minimal geometric pattern -->
  <rect x="100" y="180" width="160" height="160" rx="16" fill="#b0cfe6" fill-opacity="0.5" transform="rotate(12 180 260)"/>
  <rect x="900" y="300" width="120" height="120" rx="12" fill="#9ac0dd" fill-opacity="0.4" transform="rotate(-8 960 360)"/>
  <circle cx="600" cy="315" r="100" fill="#a4c8e2" fill-opacity="0.35"/>
  <circle cx="350" cy="420" r="50" fill="#8cb8d8" fill-opacity="0.3"/>
  <circle cx="850" cy="180" r="70" fill="#b8d4ec" fill-opacity="0.3"/>
  <!-- Subtle line accents -->
  <line x1="200" y1="500" x2="1000" y2="500" stroke="#a0c4de" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="250" y1="520" x2="950" y2="520" stroke="#a0c4de" stroke-opacity="0.2" stroke-width="1"/>
</svg>
